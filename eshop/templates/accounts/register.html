{% extends "base/base.html" %} {% block start %}
<section class="section-conten padding-y" style="min-height: 84vh">
  <!-- ============================ COMPONENT Register   ================================= -->
  <div class="card mx-auto" style="max-width: 380px; margin-top: 100px">
    <div class="card-body">
      <h4 class="card-title mb-4">Sign in</h4>
      <form method="POST">
        {% csrf_token %}

        <!--first_name-->

        <div class="form-group">
          <input
            name="first_name"
            class="form-control"
            required
            placeholder="first Name"
            type="text"
          />
        </div>

        <!--last_name-->
        <div class="form-group">
          <input
            name="last_name"
            class="form-control"
            required
            placeholder="Last Name"
            type="text"
          />
        </div>

        <!-- email-->

        <div class="form-group">
          <input
            name="email"
            class="form-control"
            required
            placeholder="Email"
            type="text"
          />
        </div>

        <!-- form-group// -->
        <div class="form-group">
          <input
            name="password"
            class="form-control"
            required
            placeholder="Password"
            type="password"
          />
        </div>
        <!-- form-group// -->

        <!-- form-group form-check .// -->
        <div class="form-group">
          <button type="submit" class="btn btn-primary btn-block">
            Register
          </button>
        </div>
        <!-- form-group// -->
      </form>
    </div>
    <!-- card-body.// -->
  </div>
  <!-- card .// -->

  <br /><br />
  <!-- ============================ COMPONENT Register  END.// ================================= -->
</section>
{% endblock %}
